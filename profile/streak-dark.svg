<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="495" height="195" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Dividers -->
  <line x1="165" y1="20" x2="165" y2="175" stroke="#30363d" stroke-width="1"/>
  <line x1="330" y1="20" x2="330" y2="175" stroke="#30363d" stroke-width="1"/>

  <!-- === Total Contributions === -->
  <text x="82" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#39d353">83</text>
  <text x="82" y="82" text-anchor="middle" font-size="12" fill="#e6edf3">Total Contributions</text>
  <text x="82" y="100" text-anchor="middle" font-size="11" fill="#7d8590">GitHub + GitLab + Blender</text>

  <!-- === Current Streak === -->
  <!-- Fire emoji circle -->
  <circle cx="247" cy="80" r="32" fill="none" stroke="#e8793a" stroke-width="3"/>
  <text x="247" y="72" text-anchor="middle" font-size="20">🔥</text>
  <text x="247" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#e8793a">41</text>
  <text x="247" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#e8793a">Current Streak</text>
  <text x="247" y="150" text-anchor="middle" font-size="10" fill="#7d8590">Apr 12, 2026 - May 22, 2026</text>

  <!-- === Longest Streak === -->
  <text x="412" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#39d353">41</text>
  <text x="412" y="82" text-anchor="middle" font-size="12" fill="#e6edf3">Longest Streak</text>
  <text x="412" y="100" text-anchor="middle" font-size="11" fill="#7d8590">Apr 12, 2026 - May 22, 2026</text>

  <!-- Platform note -->
  <text x="247.5" y="187" text-anchor="middle" font-size="9" fill="#7d8590">Includes GitHub · GitLab (freedesktop) · Blender Projects</text>
</svg>